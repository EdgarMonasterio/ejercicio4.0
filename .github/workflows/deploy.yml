---
name: CI-CD RESTCONF

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Build - lint
        run: |
          yamllint config .github
          flake8 src tests --max-line-length 100

      - name: Test - unitarias
        run: pytest -q
